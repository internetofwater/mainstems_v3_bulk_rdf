schemaVersion: "2"
kind: mixin
name: bulk-mainstems-sbx-dev-kit
displayName: Bulk Dev Kit
description: "Network access for key endpoints"

permissions:
  network:
    allow:

      # geoconnex / wqp info
      - geoconnex.us
      - reference.geoconnex.us
      - features.geoconnex.us
      - graph.geoconnex.us
      - qlever.internetofwater.app
      - docs.geoconnex.us
      - labs.waterdata.usgs.gov
      - waterqualitydata.us
      - www.waterqualitydata.us

      # source of the mainstems.gpkg this integration reads (a GitHub
      # release asset; github.com redirects to release-assets.githubusercontent.com,
      # which serves the actual blob)
      - github.com
      - release-assets.githubusercontent.com

      # hydroshare references if necessary for debugging
      - www.hydroshare.org
      - hydroshare.org

      # OpenFreeMap basemap tiles for the explorer map
      - tiles.openfreemap.org

      # RDF/OWL/RDFS/SHACL/XSD, and the SKOS, DCAT, PROV, SOSA and SSN namespaces.
      # www.w3.org is what every http://www.w3.org/... namespace redirects to over
      # https, and is what currently fails TestValidateSALModuleOntology.
      - www.w3.org
      - w3.org

      # Dublin Core. purl.org 303s to dublincore.org for /dc/elements and /dc/terms.
      - purl.org
      - purl.archive.org
      - dublincore.org
      - www.dublincore.org

      # w3id.org is a redirector; the SAL Module spec it serves is hosted on
      # GitHub Pages, so the target host has to be allowed as well as w3id.org.
      # (github.com itself is allowed above, for the mainstems.gpkg release asset.)
      - w3id.org
      - cgs-earth.github.io
      - raw.githubusercontent.com

      # schema.org serves HTML to SAL's Accept header, so validation falls back to
      # the bundled copy in build/vocab. Allowed anyway so the fetch fails on
      # content type rather than on policy.
      - schema.org

      # GeoSPARQL, Simple Features, and the HY_Features application schema.
      - www.opengis.net
      - opengis.net
      - schemas.opengis.net
      - docs.opengeospatial.org

      # Vocabularies used by the example projects and build testdata.
      - geoconnex.us
      - qudt.org
      - vocabulary.odm2.org
      - hyfo.spatialai.org
      - nhdplusv2.spatialai.org

      # DuckDB downloads its extensions on first use; `sal duckdb-extensions`
      # primes that cache and every query path depends on it.
      - extensions.duckdb.org

      # Headless Chromium, for screenshotting the docs site and the `sal serve`
      # UI. cdn.playwright.dev is what `playwright install` resolves first; it
      # redirects to the prss.microsoft.com CDN that serves the actual build,
      # and falls back to azureedge.net on older releases.
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      - playwright.azureedge.net

      # docker for bulk integrations
      - docker.com
      - download.docker.com

setup:
  install:
    - command: "sudo apt-get install -y ripgrep"
    # default agent user
      user: "1000"
      description: Install development or build dependencies
